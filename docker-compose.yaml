version: '3.8'

services:
  db:
    image: postgres:17.3
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pperadetlic8
      POSTGRES_DB: jdkproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - db

volumes:
  postgres_data: